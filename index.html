<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic War</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #wrap { position: relative; width: 100vw; height: 100vh; cursor: none; font-family: 'Orbitron', monospace; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 20px; display: flex;
    justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
    background: linear-gradient(rgba(0,0,0,0.75), transparent);
  }
  .hb { display: flex; flex-direction: column; gap: 3px; }
  .hl { font-size: 8px; color: rgba(255,136,0,0.5); letter-spacing: 3px; }
  .hv { font-size: 20px; font-weight: 900; color: #f80; text-shadow: 0 0 14px rgba(255,136,0,0.7); }
  #lives-row { display: flex; gap: 5px; margin-top: 3px; }

  #gun-hud {
    position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: none; z-index: 10;
  }
  /* Desktopda qurol paneli pastroqda turishi uchun */
  @media (min-width: 769px) {
    #gun-hud { bottom: 16px; }
  }
  #gun-pips { display: flex; gap: 6px; }
  .pip {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.2); transition: all .3s;
  }
  .pip.active { box-shadow: 0 0 7px currentColor; }
  #xp-bar-wrap { width: 190px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #xp-bar { height: 100%; width: 0%; border-radius: 2px; transition: width .25s ease, background .4s; }
  #gun-label { font-size: 8px; letter-spacing: 2px; color: rgba(255,255,255,0.4); }
  #gun-name  { font-size: 11px; font-weight: 700; letter-spacing: 2px; }

  #overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; background: rgba(0,0,0,0.7); padding: 20px; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(26px,5vw,50px); font-weight: 900; letter-spacing: 6px;
    color: #fff; text-shadow: 0 0 30px #f80, 0 0 60px rgba(255,136,0,0.3); margin-bottom: 10px;
  }
  #overlay .sub { font-size: clamp(9px,1.5vw,11px); color: rgba(255,136,0,0.65); letter-spacing: 3px; margin-bottom: 6px; }
  #overlay .score-display { font-size: clamp(14px,2.5vw,22px); color: #f80; margin: 8px 0; }
  .mbtn {
    margin-top: 18px; background: transparent; border: 1.5px solid #f80; color: #f80;
    font-family: 'Orbitron', monospace; font-size: clamp(10px,1.6vw,12px);
    padding: 11px 32px; letter-spacing: 4px; cursor: pointer; transition: all .2s; pointer-events: all;
  }
  .mbtn:hover { background: rgba(255,136,0,0.15); box-shadow: 0 0 22px rgba(255,136,0,0.35); }

  #crosshair { position: absolute; pointer-events: none; z-index: 30; transform: translate(-50%,-50%); display: none; }
